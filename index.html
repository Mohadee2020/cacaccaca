<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorpresa Especial 💜</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-cover bg-center bg-fixed" style="background-image: url('https://images8.alphacoders.com/666/thumb-1920-666149.jpg')">
    <!-- Preloader -->
    <div id="preloader" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-80 z-50">
        <div class="text-white text-2xl font-bold animate-pulse">Cargando sorpresita con amor 💜...</div>
    </div>

    <!-- Contenido principal -->
    <div class="min-h-screen flex items-center justify-center p-4">
        <div id="countdown-container" class="glass-container text-center p-8 rounded-2xl shadow-2xl">
            <div id="countdown" class="text-8xl font-bold text-white text-shadow relative">
                192
                <div id="particles"></div>
            </div>
        </div>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
