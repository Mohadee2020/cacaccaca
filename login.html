    <title>Iniciar Sesión 💜</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-cover bg-center bg-fixed" style="background-image: url('https://images8.alphacoders.com/666/thumb-1920-666149.jpg')">
    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="flex flex-col md:flex-row gap-8 w-full max-w-6xl">
            <!-- Formulario de login -->
            <div class="glass-container p-8 rounded-2xl shadow-2xl w-full md:w-1/2">
                <h1 class="text-3xl font-bold text-white text-shadow mb-6">Iniciar Sesión</h1>
                <form id="loginForm" class="space-y-4">
                    <div>
                        <label for="username" class="block text-white text-shadow mb-2">Usuario</label>
                        <input type="text" id="username" class="w-full p-3 rounded-lg bg-white bg-opacity-20 backdrop-blur-sm border border-white border-opacity-30 text-white placeholder-white placeholder-opacity-70 focus:outline-none focus:ring-2 focus:ring-green-300">
                    </div>
                    <div>
                        <label for="password" class="block text-white text-shadow mb-2">Contraseña</label>
                        <input type="password" id="password" class="w-full p-3 rounded-lg bg-white bg-opacity-20 backdrop-blur-sm border border-white border-opacity-30 text-white placeholder-white placeholder-opacity-70 focus:outline-none focus:ring-2 focus:ring-green-300">
                    </div>
                    <button type="submit" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded-lg transition duration-300 transform hover:scale-105 flex items-center justify-center gap-2">
                        <span>Entrar</span>
                        <span class="heart-beat">💜</span>
                    </button>
                </form>
                <div id="errorMessage" class="mt-4 text-red-300 text-shadow hidden"></div>
            </div>
